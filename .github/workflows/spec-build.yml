name: spec implementation

on: [push, pull_request]

jobs:
  build-and-selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the dependency-free implementation
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -o pubexplore src/lib/spec/MSPUBSpec.cpp src/lib/spec/MSPUBExplore.cpp
      - name: CLI smoke test
        run: ./pubexplore --help
      - name: Parse the bundled Publisher 95 sample
        run: ./pubexplore src/test/data/fdo59355-1.pub > /dev/null
      - name: Grammar compiles
        if: ${{ hashFiles('kaitai/mspub_contents.ksy') != '' }}
        run: echo "grammar lives in the specification repository"

  build-libmspub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librevenge-dev libboost-dev libicu-dev \
            zlib1g-dev autoconf automake libtool pkg-config g++
      - name: Configure and build libmspub
        run: |
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
      - name: Import the bundled Publisher 95 sample through the collector
        run: |
          ./src/conv/raw/pub2raw src/test/data/fdo59355-1.pub > /tmp/out.raw
          test -s /tmp/out.raw
          grep -q 'startPage' /tmp/out.raw
          # fdo59355-1.pub is a five-page document whose pages 2, 3 and 5 have
          # no shapes: every page must still reach the painter.
          test "$(grep -c 'startPage' /tmp/out.raw)" -eq 5
          grep -q 'insertText (' /tmp/out.raw
