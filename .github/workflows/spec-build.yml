name: spec implementation

on: [push, pull_request]

jobs:
  build-and-selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the dependency-free implementation
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -o pubexplore src/lib/spec/MSPUBSpec.cpp src/lib/spec/MSPUBExplore.cpp
      - name: CLI smoke test
        run: ./pubexplore --help
      - name: Parse the bundled Publisher 95 sample
        run: ./pubexplore src/test/data/fdo59355-1.pub > /dev/null
      - name: Grammar compiles
        if: ${{ hashFiles('kaitai/mspub_contents.ksy') != '' }}
        run: echo "grammar lives in the specification repository"

  build-libmspub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librevenge-dev libboost-dev libicu-dev \
            zlib1g-dev autoconf automake libtool pkg-config g++
      - name: Configure and build libmspub
        run: |
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
